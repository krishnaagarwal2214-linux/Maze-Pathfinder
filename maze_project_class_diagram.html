<h2 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Class diagram showing the Cell class and the MazeGenerator and MazeSolver modules with their functions</h2>
<style>
#classdiagram svg .divider path { stroke-opacity: 0.5; }
</style>
<div id="classdiagram"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('classdiagram-svg', `classDiagram
  class Cell {
    +int x
    +int y
    +dict walls
    +bool visited
    +bool solve_visited
    +Cell parent
    +bool on_path
    +check_cell(x, y, grid_cells, cols, rows)
    +check_neighbors(grid_cells, cols, rows)
    +remove_walls(current, next)$
  }
  class MazeGenerator {
    <<module maze_generator.py>>
    +build_grid(cols, rows)
    +generate_step(current_cell, stack, grid_cells, cols, rows)
  }
  class MazeSolver {
    <<module maze_solver.py>>
    +find_solve_neighbors(cell, grid_cells, cols, rows)
    +start_bfs(start_cell)
    +solve_step(queue, end_cell, grid_cells, cols, rows)
  }
  MazeGenerator "1" --> "many" Cell : creates
  MazeSolver ..> Cell : reads and writes`);
document.getElementById('classdiagram').innerHTML = svg;
</script>
